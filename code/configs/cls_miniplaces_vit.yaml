output_folder: "../logs"
model_type: "VIT"
dataset:
  root_folder: "../data"

model:
  patch_size: 8
  embed_dim: 192
  depth: 6
  num_heads: 6
  mlp_ratio: 4.0
  drop_path_rate: 0.1
  use_abs_pos: true
  window_size: 4
  window_block_indexes: [0, 1, 3, 4]

loader:
  batch_size: 128

opt:
  type: AdamW
  weight_decay: 0.05
  learning_rate: 0.0005
  epochs: 80
  warmup_epochs: 5

# see cls_libs/config.py for more details
